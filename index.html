var GUIDE_CSS="\n.gd{color:#111;font-size:15px;line-height:1.55;text-align:left}\n.gd *{box-sizing:border-box}\n.gd nav.toc{background:#fff;border:2px solid #111;border-radius:16px;padding:12px 14px;margin-bottom:14px}\n.gd nav.toc h2{margin:0 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.04em;font-weight:900}\n.gd nav.toc a{display:inline-block;margin:4px 6px 4px 0;padding:6px 10px;border:2px solid #111;border-radius:999px;color:#111;text-decoration:none;font-weight:700;font-size:14px}\n.gd section{background:#fff;border:2px solid #111;border-radius:16px;padding:14px;margin-bottom:14px;box-shadow:4px 4px 0 #111;scroll-margin-top:96px}\n.gd h2{margin:0 0 8px;font-size:19px;line-height:1.2;font-weight:900}\n.gd h3{margin:16px 0 6px;font-size:16px;font-weight:800}\n.gd p{margin:8px 0}\n.gd ol{list-style:decimal;padding-left:22px;margin:8px 0}\n.gd ul{list-style:disc;padding-left:22px;margin:8px 0}\n.gd li{margin:5px 0}\n.gd a{color:#111;text-decoration:underline}\n.gd code{background:#fff8dc;border:1px solid #111;border-radius:6px;padding:1px 5px;font:13px ui-monospace,SFMono-Regular,Menlo,monospace;overflow-wrap:anywhere}\n.gd pre{background:#fff8dc;border:2px solid #111;border-radius:12px;padding:12px;overflow:auto;margin:10px 0;font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;max-width:100%}\n.gd pre code{background:none;border:0;padding:0;font-size:inherit;overflow-wrap:normal}\n.gd button.copy{background:#ffc400;color:#111;border:2px solid #111;border-radius:12px;padding:10px 14px;font-weight:800;font-size:15px;min-height:44px;cursor:pointer}\n.gd .note{border-left:6px solid #ffc400;background:#fff8dc;padding:10px 12px;border-radius:8px;margin:10px 0}\n.gd .warn{border-left:6px solid #d33;background:#fff8dc;padding:10px 12px;border-radius:8px;margin:10px 0}\n.gd .tag{display:inline-block;background:#111;color:#ffc400;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:800;vertical-align:middle}\n.gd table{border-collapse:collapse;width:100%;margin:8px 0;font-size:14px}\n.gd th,.gd td{border:2px solid #111;padding:6px 8px;text-align:left;vertical-align:top}\n.gd th{background:#ffc400}\n.gd .tablewrap{overflow-x:auto}\n";var GUIDE_HTML="<nav class=\"toc\" aria-label=\"Contents\">\n  <h2>Jump to<\/h2>\n  <a href=\"#install\">Install<\/a>\n  <a href=\"#privacy\">Your data<\/a>\n  <a href=\"#daily\">Daily use<\/a>\n  <a href=\"#fill\">Fill from a note<\/a>\n  <a href=\"#sheets\">Google Sheets<\/a>\n  <a href=\"#devices\">AI devices<\/a>\n  <a href=\"#backup\">Backup<\/a>\n  <a href=\"#help\">Troubleshooting<\/a>\n<\/nav>\n\n<section id=\"install\">\n  <h2>1. Put it on your phone<\/h2>\n  <ul>\n    <li><b>Android (Chrome):<\/b> open the app, tap the menu (three dots), then <b>Add to Home screen<\/b> or <b>Install app<\/b>.<\/li>\n    <li><b>iPhone (Safari):<\/b> open the app, tap Share, then <b>Add to Home Screen<\/b>.<\/li>\n  <\/ul>\n  <div class=\"note\">Your logs are saved <b>on that phone only<\/b>, in the browser. A different phone, a private window,\n  or clearing browser data will not have them. Export now and then as a backup (see <a href=\"#backup\">Backup<\/a>).<\/div>\n<\/section>\n\n<section id=\"privacy\">\n  <h2>Where your logs are saved<\/h2>\n  <p>Your logs are saved in two places only:<\/p>\n  <ol>\n    <li><b>On your device.<\/b> Every log you save stays in the app on your phone.<\/li>\n    <li><b>In your own Google Sheet<\/b>, as a backup, if you set up Google Sheets in <a href=\"#sheets\">section 4<\/a>.<\/li>\n  <\/ol>\n  <p>Nothing you save can be seen by anyone else, or reached from anywhere else, unless you share a copy yourself:<\/p>\n  <ul>\n    <li><b>Share your Google Sheet<\/b> with your supervisor when they need it.<\/li>\n    <li><b>Export the logs you need<\/b> (Export tab) when you need documentation to support a specific incident.<\/li>\n  <\/ul>\n<\/section>\n\n<section id=\"daily\">\n  <h2>2. Log a run<\/h2>\n  <p>The bottom bar has six tabs: <b>Today, Week, Schools, Voice, Settings, Export<\/b>.<\/p>\n  <h3>Set up once, in Settings<\/h3>\n  <ol>\n    <li>Open <b>Settings<\/b> and enter your <b>Driver Name<\/b> and <b>Bus Number<\/b>, then tap <b>Save Profile<\/b>.<\/li>\n    <li>Open <b>Schools<\/b> and make sure your schools are listed.<\/li>\n  <\/ol>\n  <h3>Each run, on the Today tab<\/h3>\n  <ol>\n    <li>Check the <b>Date<\/b>, then choose the <b>School<\/b>.<\/li>\n    <li>Enter the <b>Route Number<\/b> and <b>Tier<\/b> (0 to 5). The <b>Bus Number<\/b> starts as the bus number saved in your profile and can be changed.<\/li>\n    <li>Tick <b>Spare<\/b> and enter the spare bus number if you are on a spare bus.<\/li>\n    <li>Tick <b>Route Sub/Breakdown<\/b> if you are covering another route or a bus breakdown. It clears after you save.<\/li>\n    <li>Tap <b>Start Route Now<\/b> or type the <b>Start Time<\/b>. Fill in the <b>End Time<\/b> when you finish (the <b>Now<\/b> button stamps the current time).<\/li>\n    <li>Add the kids count, weather, notes and anything else that applies, then tap <b>Save Log<\/b>.<\/li>\n  <\/ol>\n  <p>The <b>Week<\/b> tab lists your saved logs and totals. To fix a log, open it and use its edit option; it loads back into the form so you can save it again.<\/p>\n  <div class=\"note\">Log kid counts only. Do not put student names in notes if your district does not allow it.<\/div>\n<\/section>\n\n<section id=\"fill\">\n  <h2>3. Fill the form from a note<\/h2>\n  <p>Instead of typing, you can say or paste one line and let the app fill the form.<\/p>\n  <p>Example line:<\/p>\n  <pre><code>route 336 tier 0 bus 4114 PM 15 kids<\/code><\/pre>\n  <ol>\n    <li>Open the <b>Voice<\/b> tab.<\/li>\n    <li>Tap <b>Start Mic<\/b> and speak the line, <b>or<\/b> paste it into the box.<\/li>\n    <li>Tap <b>Fill Form From Text<\/b> (or copy the line anywhere and tap <b>Paste &amp; Fill From Clipboard<\/b>).<\/li>\n    <li>A message lists what was filled. Go to the <b>Today<\/b> tab, check it, and tap <b>Save Log<\/b>.<\/li>\n  <\/ol>\n  <p>It understands route, tier, bus, kids, AM/PM, delay minutes (\"10 minutes late\"), weather, spare bus,\n  your school's name, and the words \"breakdown\" or \"route sub\". Numbers in words work too (\"twenty five students\").\n  Nothing is saved until you tap Save Log.<\/p>\n  <h3>Using a link<\/h3>\n  <p>Opening the app with your note after <code>?gardian=<\/code> fills the form the same way, for example:<\/p>\n  <pre><code>https://bus-gardian.netlify.app?gardian=route%20336%20tier%200%20bus%204114%20PM%2015%20kids<\/code><\/pre>\n  <p>In Settings, each device section has a <b>Generate Link<\/b> button that builds a link like this from its template.<\/p>\n<\/section>\n\n<section id=\"sheets\">\n  <h2>4. Send your logs to Google Sheets<\/h2>\n  <p>Each time you save a log, the app can also send it to a Google Sheet. You set this up once.<\/p>\n\n  <h3>A. Make the sheet and the script<\/h3>\n  <ol>\n    <li>Go to <b>sheets.google.com<\/b> and create a new blank spreadsheet. Name it \"Bus LogBook\".<\/li>\n    <li>Click <b>Extensions &rarr; Apps Script<\/b>.<\/li>\n    <li>Delete everything in the editor, then paste the script below.<\/li>\n    <li>Click the save icon.<\/li>\n  <\/ol>\n  <pre id=\"script\"><code>const HEADERS = [\"id\",\"localDate\",\"localTime\",\"school\",\"route\",\"tier\",\"bus\",\n  \"spare\",\"spareBus\",\"breakdownCover\",\"startTime\",\"endTime\",\"weather\",\"road\",\n  \"tripShift\",\"traffic\",\"delayMin\",\"odometer\",\"kids\",\"notes\",\"issues\",\"createdAt\"];\n\nfunction doPost(e) {\n  var ss = SpreadsheetApp.getActiveSpreadsheet();\n  var sheet = ss.getSheetByName(\"Logs\") || ss.insertSheet(\"Logs\");\n  if (sheet.getLastRow() === 0) sheet.appendRow(HEADERS);\n\n  var data = {};\n  try { data = JSON.parse(e.postData.contents); }\n  catch (err) { data = { notes: \"Unreadable data\" }; }\n\n  if (!data || typeof data !== \"object\" || Array.isArray(data)) {\n    data = { notes: \"Unreadable data\" };\n  }\n  if (data.test) {\n    data = { school: \"TEST\", notes: \"Webhook test\" };\n  }\n\n  sheet.appendRow(HEADERS.map(function (h) {\n    return clean(data[h]);\n  }));\n  return ContentService.createTextOutput(\"ok\");\n}\n\n// Only plain text goes into the sheet: long values are cut short and\n// anything that looks like a formula (=, +, -, @) is stored as text.\nfunction clean(v) {\n  if (v === undefined || v === null) return \"\";\n  if (typeof v === \"boolean\" || typeof v === \"number\") return v;\n  v = String(v).slice(0, 2000);\n  if (/^[=+\\-@\\t\\r]/.test(v)) v = \"'\" + v;\n  return v;\n}<\/code><\/pre>\n  <p><button class=\"copy\" type=\"button\" id=\"copybtn\">Copy the script<\/button> <span id=\"copystate\" aria-live=\"polite\"><\/span><\/p>\n\n  <h3>B. Publish it as a web app<\/h3>\n  <ol>\n    <li>Click <b>Deploy &rarr; New deployment<\/b>.<\/li>\n    <li>Click the gear icon and choose <b>Web app<\/b>.<\/li>\n    <li>Set <b>Execute as<\/b> to <b>Me<\/b>.<\/li>\n    <li>Set <b>Who has access<\/b> to <b>Anyone<\/b>. (The app cannot sign in to Google, so this is required.)<\/li>\n    <li>Click <b>Deploy<\/b>, then <b>Authorize access<\/b> and approve with your Google account. If Google says the app is\n        unverified, click <b>Advanced<\/b> and continue. It is your own script.<\/li>\n    <li>Copy the <b>Web app URL<\/b>. It ends in <code>/exec<\/code>.<\/li>\n  <\/ol>\n  <div class=\"warn\"><b>Keep that URL private.<\/b> Anyone who has it can add rows to your sheet. The script above stores everything as plain text, so a row like that cannot run formulas in your sheet. If you set up an older version of the script, paste this one in and publish a new version (see the note below).<\/div>\n\n  <h3>C. Connect the app<\/h3>\n  <ol>\n    <li>Open the app, go to <b>Settings<\/b>, and find <b>Google Sheets Webhook Connection<\/b>.<\/li>\n    <li>Paste the URL into <b>Webhook URL<\/b>.<\/li>\n    <li>Turn <b>Auto Save<\/b> on. <b>Logs are only sent when Auto Save is on.<\/b><\/li>\n    <li>Tap <b>Save All<\/b>, then <b>Test Webhook<\/b>.<\/li>\n    <li>Open your sheet. A new <b>Logs<\/b> tab should appear with a TEST row. You can delete that row.<\/li>\n  <\/ol>\n  <div class=\"note\">The app sends data in a way that cannot report errors back, so it will say \"sent\" even if the sheet did not\n  receive it. Always check the sheet after the test. If you later edit the script, use\n  <b>Deploy &rarr; Manage deployments &rarr; edit &rarr; New version<\/b>, or the changes will not take effect.<\/div>\n\n  <h3>What each column means<\/h3>\n  <div class=\"tablewrap\">\n  <table>\n    <tr><th>Column<\/th><th>Meaning<\/th><\/tr>\n    <tr><td>localDate, localTime<\/td><td>When the log was saved<\/td><\/tr>\n    <tr><td>school, route, tier, bus<\/td><td>The main run details<\/td><\/tr>\n    <tr><td>spare, spareBus<\/td><td>Whether a spare was used, and its number<\/td><\/tr>\n    <tr><td>breakdownCover<\/td><td>The Route Sub/Breakdown box<\/td><\/tr>\n    <tr><td>startTime, endTime, delayMin<\/td><td>Times and minutes late<\/td><\/tr>\n    <tr><td>weather, road, tripShift, traffic<\/td><td>Conditions, and AM/PM shift<\/td><\/tr>\n    <tr><td>odometer, kids, notes, issues<\/td><td>Mileage, rider count, free text<\/td><\/tr>\n  <\/table>\n  <\/div>\n  <p>Only logs saved after you turn Auto Save on are sent. To move older logs into the sheet, use the <b>Export<\/b>\n  tab to download a CSV and import it with <b>File &rarr; Import<\/b>.<\/p>\n<\/section>\n\n<section id=\"devices\">\n  <h2>5. AI devices (optional)<\/h2>\n  <div class=\"note\"><b>You do not need any of these devices to use the app.<\/b> Devices that can record what is said word for\n  word are there to help you remember exactly what was said in a conversation, so details do not get twisted by memory.\n  They are a helpful extra, not a requirement.<br><br>\n  Before you record anyone, check your district's policy and your local recording rules.<\/div>\n  <p>All of these work the same way in the end: the device captures what you say, you get that text, and the app fills\n  the form from it. The app itself only reads text. It does not connect to any device directly, so you always check the\n  form and tap Save Log yourself.<\/p>\n\n  <div class=\"note\">What to say, for every device: a short line such as <code>route 336 tier 0 bus 4114 PM 15 kids<\/code>.\n  Say it clearly and include the words route, tier, bus and kids.<\/div>\n\n  <h3>Looki L1 <span class=\"tag\">via Claude Code<\/span><\/h3>\n  <p>Looki connects through its own sign-in, which a web page cannot do, so the link goes through Claude Code.<\/p>\n  <ol>\n    <li>On your computer, install the plugin: <code>npx -y plugins add looki-ai/looki-plugin --target claude-code -y<\/code><\/li>\n    <li>Restart Claude Code, or run <code>/reload-plugins<\/code>.<\/li>\n    <li>Run <code>/mcp<\/code>, choose <b>looki<\/b>, then <b>Authenticate<\/b>, and sign in on the Looki page that opens.\n        Type your login only on Looki's own page.<\/li>\n    <li>Run <code>/mcp<\/code> again and make sure <b>looki<\/b> shows as connected.<\/li>\n    <li>Wear your Looki and say your log line aloud.<\/li>\n    <li>In Claude Code, ask: <i>\"Find my latest Looki moment and give me the bus log as one line: route, tier, bus, AM or PM, kids.\"<\/i><\/li>\n    <li>Copy that line. In the app, open <b>Voice<\/b> and tap <b>Paste &amp; Fill From Clipboard<\/b>.<\/li>\n  <\/ol>\n  <p>This depends on Looki capturing and summarizing what you said. Check the line Claude gives you against what you said before you save.<\/p>\n\n  <h3>Ray-Ban Meta glasses<\/h3>\n  <ol>\n    <li>In the app, open <b>Settings<\/b>, find <b>Ray-Ban Meta Glasses<\/b>, and turn <b>Meta Enabled<\/b> on.<\/li>\n    <li>Say: <i>\"Hey Meta, take a note: Gardian, route 336 tier 0 bus 4114 PM 15 kids.\"<\/i><\/li>\n    <li>Open the note in the Meta app and copy its text.<\/li>\n    <li>In the app, open <b>Voice<\/b> and tap <b>Paste &amp; Fill From Clipboard<\/b>.<\/li>\n  <\/ol>\n\n  <h3>Cyan (HeyCyan) smart glasses<\/h3>\n  <ol>\n    <li>In Settings, find the <b>Cyan<\/b> section and turn <b>Cyan Enabled<\/b> on.<\/li>\n    <li>Wear the glasses and power them on.<\/li>\n    <li>Say: <i>\"HeyCyan, take a note: Gardian, route 336 tier 0 bus 4114 PM 15 kids.\"<\/i><\/li>\n    <li>Open the Cyan app, copy the note's transcript, then use <b>Paste &amp; Fill From Clipboard<\/b> on the Voice tab.<\/li>\n  <\/ol>\n\n  <h3>Fieldy pendant or watch<\/h3>\n  <ol>\n    <li>In Settings, find <b>Fieldy<\/b> and turn <b>Fieldy Enabled<\/b> on.<\/li>\n    <li>Wear Fieldy, make sure it is paired to your phone by Bluetooth, and tap it to start listening.<\/li>\n    <li>Say: <i>\"Gardian, route 336 tier 0 bus 4114 PM 15 kids.\"<\/i><\/li>\n    <li>Open the Fieldy app, copy the transcript line, then use <b>Paste &amp; Fill From Clipboard<\/b> on the Voice tab.<\/li>\n  <\/ol>\n\n  <div class=\"warn\"><b>About \"Auto Sync\" buttons in Settings.<\/b> The Fieldy section says the app can receive transcripts\n  automatically through the webhook. It cannot: the webhook only sends logs <i>out<\/i> to Google Sheets. For now, use the\n  copy-and-paste steps above.<\/div>\n\n  <h3>No device? Use your phone's own voice typing<\/h3>\n  <p>On the Voice tab, tap <b>Start Mic<\/b> and say the line, or tap the microphone on your phone's keyboard in the text box.<\/p>\n<\/section>\n\n<section id=\"backup\">\n  <h2>6. Backup and reset<\/h2>\n  <ul>\n    <li><b>Export:<\/b> open the <b>Export<\/b> tab and download your logs as a CSV file. Open it in Excel or Google Sheets.<\/li>\n    <li><b>Reset:<\/b> <b>Settings &rarr; Clear and Reset - All Keys<\/b> removes logs, schools and settings from this phone.\n        You must tick the confirmation box, then tap <b>Yes, Delete All<\/b>. It cannot be undone, so export first.<\/li>\n  <\/ul>\n<\/section>\n\n<section id=\"help\">\n  <h2>7. Troubleshooting<\/h2>\n  <ul>\n    <li><b>The app looks old after an update.<\/b> Refresh the page, or close and reopen the home-screen app.<\/li>\n    <li><b>Paste &amp; Fill says it can't read the clipboard.<\/b> Your browser blocked it. Paste into the Voice text box and tap <b>Fill Form From Text<\/b>.<\/li>\n    <li><b>\"I couldn't find log details.\"<\/b> Include words like route, tier, bus and kids, for example <code>route 336 tier 0 bus 4114 PM 15 kids<\/code>.<\/li>\n    <li><b>Nothing reaches Google Sheets.<\/b> Check that Auto Save is on, the URL ends in <code>/exec<\/code>, access is set to <b>Anyone<\/b>, and the script was deployed as a web app. Then run Test Webhook again.<\/li>\n    <li><b>Logs missing.<\/b> Logs live in one browser on one phone. Open the app in the same browser you used before.<\/li>\n  <\/ul>\n<\/section>";
